models:
  - name: stg_crypto_prices
    columns:
      - name: symbol
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]
  - name: fct_hourly_prices
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, hour_ts]
    columns:
      - name: avg_price
        tests: [not_null]
      - name: volatility
        tests: [not_null]
